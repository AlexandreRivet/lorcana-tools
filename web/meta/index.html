<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Méta Lorcana</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <a class="back-link" href="../">← Tous les outils</a>
        <h1>Méta Lorcana</h1>
        <p id="subtitle" class="subtitle">Chargement des données…</p>
      </header>

      <form id="filters" class="filters" aria-label="Filtres">
        <label id="queue-field" class="field" hidden>
          <span>Queue</span>
          <select id="queue"></select>
        </label>
        <label class="field">
          <span>Semaine</span>
          <select id="week"></select>
        </label>
        <label class="field">
          <span>Matchups sur</span>
          <select id="matchup-weeks">
            <option value="1">1 semaine</option>
            <option value="4">4 semaines</option>
            <option value="8">8 semaines</option>
          </select>
        </label>
      </form>

      <section id="kpis" class="kpis" aria-label="Chiffres clés"></section>
      <section
        id="kpis-archetypes"
        class="kpis"
        aria-label="Chiffres clés par archétype"
        hidden
      ></section>

      <section id="charts" class="charts"></section>

      <footer class="page-footer">
        Données © <a href="https://duels.ink/stats">Duels.ink</a>, agrégées chaque semaine depuis
        l'API publique <code>/api/stats/meta</code>.
      </footer>
    </main>
    <div id="tooltip" class="tooltip" role="status" hidden></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
